name: نشر المحتوى اليومي
on:
  schedule:
    - cron: '0 5 * * *'    # 08:00 بتوقيت الرياض
    - cron: '0 14 * * *'   # 17:00 بتوقيت الرياض
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر (daily / scout / plan / publish)'
        default: 'daily'

permissions:
  contents: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt

      - name: تشغيل وكلاء المحتوى
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY:    ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
          LLM_MODEL:         ${{ vars.LLM_MODEL }}
        run: python orchestrator.py ${{ github.event.inputs.command || 'daily' }}

      - name: مزامنة الإعدادات
        run: python scripts/sync_config.py

      - name: حفظ المقالات الجديدة
        run: |
          git config user.name  "content-agent"
          git config user.email "actions@github.com"
          git add site/src/content/blog site/public/covers site/src/site.json state
          git diff --staged --quiet && echo "لا جديد" && exit 0
          git commit -m "content: نشر تلقائي $(date -u +%F\ %H:%M)"
          git push
